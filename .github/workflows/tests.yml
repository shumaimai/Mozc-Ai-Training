name: Training source tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, v2/contextual-ranking-reset]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOZCAI_RUNTIME_ROOT: ${{ github.workspace }}/runtime-contract

    steps:
      - uses: actions/checkout@v4

      - name: Checkout paired runtime contract
        uses: actions/checkout@v4
        with:
          repository: shumaimai/Mozc-Ai
          ref: 255d8dc3d5af8317f86cea215e1011b38874b7b3
          path: runtime-contract
          lfs: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU runtime test dependencies
        run: python -m pip install numpy==2.3.2 onnxruntime==1.30.0 sentencepiece==0.2.2

      - name: Install C++ contract test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends g++ pkg-config libabsl-dev

      - name: Compile Python sources
        run: |
          python -m compileall -q tools scripts/modal_train.py scripts/modal_eval.py \
            scripts/modal_export_onnx.py scripts/modal_shippable_tau.py \
            scripts/modal_ctx_cap_sweep.py scripts/modal_clean_eval_trackB.py

      - name: Dataset tests
        run: python -m unittest discover -s tools/dataset/tests -p "test_*.py" -v

      - name: Reranker tests
        run: python -m unittest discover -s tools/rerank -p "test_*.py" -v

      - name: Phase 0 contract audit tests
        run: python -m unittest tools.rerank.test_phase0_contract -v

      - name: Cloud privacy audit
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.rerank.privacy import ensure_public_modal_paths

          launchers = list(Path("scripts").glob("modal_*.py"))
          unsafe = []
          for path in launchers:
              text = path.read_text(encoding="utf-8")
              if '.add_local_dir("data/rerank_ctx"' in text:
                  unsafe.append(str(path))
          if unsafe:
              raise SystemExit(f"unsafe Modal data upload roots: {unsafe}")

          for value in (
              "/artifacts/private/model",
              "/artifacts/usage30m_v1",
              "data/rerank_ctx/ime_usage_pairs.jsonl",
          ):
              try:
                  ensure_public_modal_paths(value)
              except ValueError:
                  pass
              else:
                  raise SystemExit(f"privacy gate accepted: {value}")
          print("cloud privacy audit passed")
          PY

      - name: Publish training sources v1.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Mozc AI Training v1.0.0
          body_path: docs/RELEASE_NOTES_V1.0.0.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-smoke-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      MOZCAI_RUNTIME_ROOT: ${{ github.workspace }}/runtime-contract
    steps:
      - uses: actions/checkout@v4
      - name: Checkout paired runtime contract
        uses: actions/checkout@v4
        with:
          repository: shumaimai/Mozc-Ai
          ref: 255d8dc3d5af8317f86cea215e1011b38874b7b3
          path: runtime-contract
          lfs: false
          persist-credentials: false
      - name: Check smoke model identity on Windows PowerShell
        shell: powershell
        run: ./tools/rerank/test_windows_smoke.ps1 -RuntimeRoot $env:MOZCAI_RUNTIME_ROOT
      - name: Check smoke model identity on PowerShell 7
        shell: pwsh
        run: ./tools/rerank/test_windows_smoke.ps1 -RuntimeRoot $env:MOZCAI_RUNTIME_ROOT
